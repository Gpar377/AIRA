apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-leak-service
  labels:
    app: memory-leak-service
    failure-mode: memory-leak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-leak-service
  template:
    metadata:
      labels:
        app: memory-leak-service
        failure-mode: memory-leak
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: memory-leak
        image: ghcr.io/christophetd/log4shell-vulnerable-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: LEAK_SIZE_MB
          value: "10"
        - name: LEAK_ENABLED
          value: "true"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: memory-leak-service
  labels:
    app: memory-leak-service
spec:
  selector:
    app: memory-leak-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
