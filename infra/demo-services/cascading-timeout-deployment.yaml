apiVersion: apps/v1
kind: Deployment
metadata:
  name: cascading-timeout-service
  labels:
    app: cascading-timeout-service
    failure-mode: cascading-timeout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cascading-timeout-service
  template:
    metadata:
      labels:
        app: cascading-timeout-service
        failure-mode: cascading-timeout
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: cascading-timeout
        image: nginx:1.14.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: BASE_DELAY
          value: "2.0"
        - name: TIMEOUT_PROBABILITY
          value: "0.3"
        - name: CASCADE_ENABLED
          value: "true"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: cascading-timeout-service
  labels:
    app: cascading-timeout-service
spec:
  selector:
    app: cascading-timeout-service
  ports:
  - port: 8082
    targetPort: 8082
    name: http
  type: ClusterIP
