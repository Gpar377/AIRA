apiVersion: apps/v1
kind: Deployment
metadata:
  name: disk-pressure-service
  labels:
    app: disk-pressure-service
    failure-mode: disk-pressure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: disk-pressure-service
  template:
    metadata:
      labels:
        app: disk-pressure-service
        failure-mode: disk-pressure
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: disk-pressure
        image: neuralops/disk-pressure-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
          name: http
        env:
        - name: WRITE_SIZE_MB
          value: "50"
        - name: PRESSURE_ENABLED
          value: "true"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: temp-storage
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: temp-storage
        emptyDir:
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: disk-pressure-service
  labels:
    app: disk-pressure-service
spec:
  selector:
    app: disk-pressure-service
  ports:
  - port: 8083
    targetPort: 8083
    name: http
  type: ClusterIP
